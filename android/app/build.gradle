plugins { id 'com.android.application' }

android {
    namespace 'id.voidplaybox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'id.voidplaybox.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'WEB_URL', '"https://voidplaybox.vercel.app/"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
